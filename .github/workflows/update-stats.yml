name: Atualizar estatísticas do GitHub

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Refazer a análise de linguagens do zero"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: perfil-readme
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verificar repositório
        run: |
          pwd
          git rev-parse --show-toplevel
          git status

      - name: Definir o ano das estatísticas
        run: echo "ANO=$(date +%Y)" >> "$GITHUB_ENV"

      - name: Gerar estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=LuisGustavoDev&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&commits_year=${{ env.ANO }}
          path: profile/stats.svg
          # GRS_TOKEN: token pessoal (classic, escopos repo, read:org e read:user) para contar os commits privados.
          # Sem ele, cai no GITHUB_TOKEN e o card mostra só os commits públicos.
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}

      # Analisa os SEUS commits em todos os repositórios (privados, de organizações e de terceiros).
      # A primeira execução lê o histórico inteiro; as seguintes só olham repositórios com push novo
      # e só somam os commits que ainda não foram contados (progresso em profile/langs-state.json).
      - name: Gerar linguagens
        env:
          GH_TOKEN: ${{ secrets.GRS_TOKEN }}
          GH_USER: LuisGustavoDev
          # Todos os e-mails que aparecem como autor nos seus commits (o noreply do GitHub já entra sozinho).
          # Confira num repositório com: git log --format='%ae' | sort | uniq -c
          AUTHOR_EMAILS: luisgustavo7310@gmail.com
          AUTHOR_NAMES: LuisGustavoDev
          IGNORED_LANGS: HTML, CSS, Dockerfile, Shell, Makefile
          LANGS_COUNT: "6"
          FULL: ${{ inputs.full && '1' || '' }}
        run: python3 scripts/top_langs.py
        continue-on-error: true # se falhar, o card de estatísticas ainda é salvo

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/langs-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza estatísticas do GitHub"
            git pull --rebase
            git push
          else
            echo "Nenhuma alteração nas imagens."
          fi

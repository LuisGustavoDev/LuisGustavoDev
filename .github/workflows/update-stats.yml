
name: Atualizar estatísticas do GitHub

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verificar repositório
        run: |
          pwd
          git rev-parse --show-toplevel
          git status

      - name: Gerar estatísticas
        run: |
          mkdir -p profile
          curl -fLsS \
            "https://github-readme-stats.vercel.app/api?username=LuisGustavoDev&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&commits_year=$(date +%Y)&nocache=$(date +%s)" \
            -o profile/stats.svg

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza estatísticas do GitHub"
            git push
          else
            echo "Nenhuma alteração na imagem."
          fi

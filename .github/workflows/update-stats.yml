
name: Atualizar estatísticas do GitHub

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Gerar estatísticas
        run: |
          mkdir -p profile
          curl -fL \
            "https://github-readme-stats.vercel.app/api?username=LuisGustavoDev&show_icons=true&theme=tokyonight&hide_border=true&count_private=true" \
            -o profile/stats.svg

      - name: Salvar alterações
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualiza estatísticas do GitHub"
          file_pattern: profile/stats.svg


name: Atualizar estatísticas do GitHub

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verificar repositório
        run: |
          pwd
          git rev-parse --show-toplevel
          git status

      - name: Definir o ano das estatísticas
        run: echo "ANO=$(date +%Y)" >> "$GITHUB_ENV"

      - name: Gerar estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=LuisGustavoDev&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&commits_year=${{ env.ANO }}
          path: profile/stats.svg
          # GRS_TOKEN: token pessoal (classic, escopos repo e read:user) para contar os commits privados.
          # Sem ele, cai no GITHUB_TOKEN e o card mostra só os commits públicos.
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}
          
      - name: Gerar linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=LuisGustavoDev&layout=compact&theme=tokyonight&hide_border=true&langs_count=6&card_width=380
          path: profile/top-langs.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza estatísticas do GitHub"
            git push
          else
            echo "Nenhuma alteração nas imagens."
          fi


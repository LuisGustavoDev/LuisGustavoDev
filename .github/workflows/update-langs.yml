name: Atualizar linguagens

on:
  schedule:
    - cron: "17 6 * * *" # 1x por dia (03:17 em Brasília) — a análise clona repositórios e é pesada
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perfil-readme
  cancel-in-progress: false

jobs:
  update-langs:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Gerar linguagens (análise dos seus commits)
        uses: lowlighter/metrics@latest
        with:
          filename: profile/top-langs.svg
          # Mesmo token clássico do outro workflow (escopos: repo, read:org, read:user)
          token: ${{ secrets.GRS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "Atualiza linguagens"
          user: LuisGustavoDev
          base: ""
          config_timezone: America/Sao_Paulo

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, dockerfile, shell, makefile
          plugin_languages_analysis_timeout: 30
          plugin_languages_analysis_timeout_repositories: 7.5

          # Todos os nomes/e-mails que aparecem como autor nos seus commits.
          # Confira com: git log --format='%an <%ae>' | sort -u
          commits_authoring: >-
            LuisGustavoDev,
            luisgustavo7310@gmail.com

          # Repositórios de organizações (não entram sozinhos). owner/repo, separados por vírgula.
          plugin_languages_indepth_custom: >-
            lscodesector/REPO-1,
            lscodesector/REPO-2

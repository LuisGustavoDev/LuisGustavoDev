<svg width="467" height="195" viewBox="0 0 467 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId">
  <title id="titleId">Most Used Languages</title>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; animation: fadeInAnimation 0.8s ease-in-out forwards; }
    @supports(-moz-appearance: auto) { .header { font-size: 15.5px; } }
    .stat { font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #38bdae; }
    @supports(-moz-appearance: auto) { .stat { font-size: 12px; } }
    .not_bold { font-weight: 400; }
    .stagger { opacity: 0; animation: fadeInAnimation 0.3s ease-in-out forwards; }
    .bar { animation: growWidth 0.6s ease-in-out forwards; transform-origin: left; }
    @keyframes fadeInAnimation { from { opacity: 0; } to { opacity: 1; } }
    @keyframes growWidth { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" height="99%" width="466" fill="#1a1b27" stroke="#e4e2e2" stroke-opacity="0"/>
  <g transform="translate(25, 35)"><text x="0" y="0" class="header">Most Used Languages</text></g>
  <g transform="translate(25, 60)">
    <mask id="rect-mask"><rect x="0" y="0" width="417" height="8" fill="white" rx="5"/></mask>
    <g class="bar"><rect mask="url(#rect-mask)" x="0.00" y="0" width="349.63" height="8" fill="#3178c6"/><rect mask="url(#rect-mask)" x="349.63" y="0" width="31.54" height="8" fill="#f1e05a"/><rect mask="url(#rect-mask)" x="381.17" y="0" width="29.73" height="8" fill="#3572A5"/><rect mask="url(#rect-mask)" x="410.91" y="0" width="3.11" height="8" fill="#b07219"/><rect mask="url(#rect-mask)" x="414.02" y="0" width="2.38" height="8" fill="#4F5D95"/><rect mask="url(#rect-mask)" x="416.41" y="0" width="0.59" height="8" fill="#e38c00"/></g>
  </g>
  <g transform="translate(25, 105)"><g class="stagger" style="animation-delay: 450ms" transform="translate(0, 0)"><circle cx="6" cy="-5" r="6" fill="#3178c6"/><text x="20" y="0" class="stat">TypeScript</text><text x="180" y="0" class="stat not_bold" text-anchor="end">83.84%</text></g><g class="stagger" style="animation-delay: 600ms" transform="translate(210, 0)"><circle cx="6" cy="-5" r="6" fill="#f1e05a"/><text x="20" y="0" class="stat">JavaScript</text><text x="180" y="0" class="stat not_bold" text-anchor="end">7.56%</text></g><g class="stagger" style="animation-delay: 750ms" transform="translate(0, 28)"><circle cx="6" cy="-5" r="6" fill="#3572A5"/><text x="20" y="0" class="stat">Python</text><text x="180" y="0" class="stat not_bold" text-anchor="end">7.13%</text></g><g class="stagger" style="animation-delay: 900ms" transform="translate(210, 28)"><circle cx="6" cy="-5" r="6" fill="#b07219"/><text x="20" y="0" class="stat">Java</text><text x="180" y="0" class="stat not_bold" text-anchor="end">0.75%</text></g><g class="stagger" style="animation-delay: 1050ms" transform="translate(0, 56)"><circle cx="6" cy="-5" r="6" fill="#4F5D95"/><text x="20" y="0" class="stat">PHP</text><text x="180" y="0" class="stat not_bold" text-anchor="end">0.57%</text></g><g class="stagger" style="animation-delay: 1200ms" transform="translate(210, 56)"><circle cx="6" cy="-5" r="6" fill="#e38c00"/><text x="20" y="0" class="stat">SQL</text><text x="180" y="0" class="stat not_bold" text-anchor="end">0.14%</text></g></g>
</svg>
